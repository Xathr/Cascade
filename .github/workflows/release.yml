name: release

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release version to create, e.g. v0.2.1 (the workflow creates the tag). Leave empty for a test build."
        required: false
        default: ""

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  RELEASE: ${{ startsWith(github.ref, 'refs/tags/') || inputs.tag != '' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable && rustup target add wasm32-wasip2

      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm32-wasip2

      - name: Test
        run: cargo test --release

      - name: Build Cascade.wasm
        run: ./build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: cascade
          path: target/wasm32-wasip2/release/Cascade.wasm
          if-no-files-found: error

      - name: Publish the release
        if: env.RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd target/wasm32-wasip2/release && sha256sum Cascade.wasm > Cascade.wasm.sha256 && cd -
          # Changes since the previous release: one line per commit subject.
          prev=$(git tag --merged HEAD --sort=-v:refname | grep -vxF "$TAG" | head -1 || true)
          {
            echo "## Changes${prev:+ since $prev}"
            echo
            changes=$(git log "${prev:+$prev..}HEAD" --no-merges --format='- %s')
            echo "${changes:-- Minor fixes}"
            echo
          } > changes.md
          {
            cat changes.md
            echo "## Install"
            echo
            echo "Put \`Cascade.wasm\` in \`plugins/\` and restart. \`/npc help\` and \`/display help\` list the commands."
          } > release-notes.md
          gh release create "$TAG" --target "$GITHUB_SHA" target/wasm32-wasip2/release/Cascade.wasm target/wasm32-wasip2/release/Cascade.wasm.sha256 \
            --title "cascade $TAG" --notes-file release-notes.md
