[package]
name = "cascade"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0"
description = "Pumpkin plugin: NPCs of any kind (players, mobs, blocks, items) and displays (text, items, blocks, particles), all clickable"
authors = ["Xathr"]
publish = false

[lib]
# Capitalised so the build produces Cascade.wasm.
name = "Cascade"
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Pinned to the Pumpkin commit this plugin is built for (0.2.2, Minecraft 26.3).
pumpkin-plugin-api = { git = "https://github.com/Pumpkin-MC/Pumpkin.git", rev = "eda69440e6369c5f8a05c3f69fc809c40dab93a6" }
# sockets, for the web editor
wasip2 = "2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 16
strip = true
