<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#241a10"/><stop offset=".6" stop-color="#15100a"/><stop offset="1" stop-color="#0b0806"/></linearGradient>
<radialGradient id="halo" cx="256" cy="230" r="250" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ff9d2e" stop-opacity=".34"/><stop offset=".65" stop-color="#ff8a1f" stop-opacity=".05"/><stop offset="1" stop-color="#ff8a1f" stop-opacity="0"/></radialGradient>
<linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb347"/><stop offset="1" stop-color="#e8691a"/></linearGradient>
<linearGradient id="plate" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe680"/><stop offset="1" stop-color="#ffbf2f"/></linearGradient>
<linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop offset=".55" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<mask id="bust"><rect width="512" height="512" fill="url(#fade)"/></mask>
<filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="14"/></filter>
<filter id="drop" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".45"/></filter>
<clipPath id="tile"><rect width="512" height="512" rx="112"/></clipPath>
</defs>
<g clip-path="url(#tile)">
<rect width="512" height="512" fill="url(#bg)"/>
<rect width="512" height="512" fill="url(#halo)"/>
<!-- displays, cascading down to the one in use -->
<rect x="268" y="52" width="118" height="26" rx="13" fill="url(#plate)" opacity=".18"/>
<rect x="226" y="92" width="150" height="32" rx="16" fill="url(#plate)" opacity=".42"/>
<g filter="url(#drop)">
<rect x="166" y="138" width="180" height="46" rx="23" fill="url(#plate)"/>
<rect x="190" y="155" width="78" height="12" rx="6" fill="#6b3d00" opacity=".6"/>
<rect x="278" y="155" width="44" height="12" rx="6" fill="#6b3d00" opacity=".32"/>
</g>
<!-- the NPC -->
<g mask="url(#bust)">
<circle cx="256" cy="262" r="48" fill="url(#body)"/>
<path d="M140 420 C140 352 196 326 256 326 C316 326 372 352 372 420 Z" fill="url(#body)"/>
<circle cx="242" cy="246" r="20" fill="#fff" opacity=".16"/>
</g>
<!-- an item display beside it, and a few particles -->
<path d="M400 226 l9 23 23 9 -23 9 -9 23 -9 -23 -23 -9 23 -9 z" fill="#ffd95a"/>
<circle cx="400" cy="258" r="34" fill="#ffd95a" opacity=".28" filter="url(#soft)"/>
<rect x="96" y="232" width="34" height="34" rx="8" transform="rotate(45 113 249)" fill="none" stroke="#ff9a3c" stroke-width="6"/>
<circle cx="148" cy="188" r="5" fill="#ffd95a"/><circle cx="118" cy="318" r="4" fill="#ff9a3c"/><circle cx="412" cy="326" r="4" fill="#ffd95a" opacity=".8"/><circle cx="430" cy="170" r="3" fill="#fff" opacity=".7"/>
<!-- the name -->
<text x="256" y="462" text-anchor="middle" font-family="Inter, 'Inter Display', 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="62" letter-spacing="-1.5" fill="#fff">Cascade</text>
</g>
<rect x="1.5" y="1.5" width="509" height="509" rx="110.5" fill="none" stroke="#fff" stroke-opacity=".09" stroke-width="3"/>
</svg>
