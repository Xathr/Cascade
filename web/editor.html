<style>
:root{--bg:#111110;--surface:#191817;--raised:#211f1d;--line:#2c2a26;--text:#eeeae2;--muted:#8d877b;--accent:#f08a24;--accent-soft:#f08a2422;--yellow:#f5c84c;--bad:#ef6a5b;--good:#86c46a;--mono:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
header{display:flex;align-items:center;gap:14px;height:52px;padding:0 16px;border-bottom:1px solid var(--line);flex:none}
header h1{margin:0;font-size:16px;font-weight:700;letter-spacing:-.2px;display:flex;align-items:center;gap:8px}
header h1 img{width:26px;height:26px;border-radius:6px}
#status{flex:1;color:var(--muted);font-size:13px;display:flex;align-items:center;gap:7px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#status::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--muted);flex:none}
#status.bad{color:var(--bad)} #status.bad::before{background:var(--bad)}
#status.good::before{background:var(--good)}
button{font:inherit;font-size:13px;font-weight:500;color:var(--text);background:var(--raised);border:1px solid var(--line);border-radius:7px;padding:6px 12px;cursor:pointer;transition:background .12s,border-color .12s}
button:hover{background:#2a2825;border-color:#3a3732}
button.primary{background:var(--accent);border-color:var(--accent);color:#1b1002;font-weight:600}
button.primary:hover{background:#f79a3c}
button.primary:disabled{background:var(--raised);border-color:var(--line);color:var(--muted);cursor:default}
button.small{padding:2px 9px;font-size:12px;border-radius:6px}
button.ghost{background:none;border-color:transparent;color:var(--muted)}
button.ghost:hover{color:var(--text);background:var(--raised)}
button.danger:hover{color:var(--bad);border-color:#5a2a25;background:#2a1715}
main{flex:1;display:grid;grid-template-columns:250px minmax(0,1fr) 360px;min-height:0}
aside,#editor{overflow:auto;background:var(--surface)}
aside{border-right:1px solid var(--line);padding:14px 10px}
#editor{border-left:1px solid var(--line)}
aside h2{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:6px 8px 6px;display:flex;justify-content:space-between;align-items:center}
aside h2 + div{margin-bottom:18px}
.item{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:7px;cursor:pointer}
.item:hover{background:var(--raised)}
.item.on{background:var(--accent-soft);box-shadow:inset 2px 0 0 var(--accent)}
.item .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.item small{color:var(--muted);font-weight:400;margin-left:4px}
.item .link{font-size:11px;color:var(--yellow);background:#f5c84c18;padding:1px 6px;border-radius:99px;white-space:nowrap}
.cube{width:12px;height:12px;border-radius:3px;flex:none}
.cube.k-mob{background:#7dbb5a}.cube.k-player{background:#5b9be0}.cube.k-block{background:#9a9a96}.cube.k-item{background:#62d0d6}.cube.k-text{background:#e9e4d6}.cube.k-particle{background:#dd79c9}
.note{color:var(--muted);font-size:12px;margin:8px 8px 0;line-height:1.5}
.note code{font-family:var(--mono);color:var(--text);font-size:11.5px}
#canvas{position:relative;min-height:0;padding:16px;display:flex;flex-direction:column}
.empty{color:var(--muted);margin:auto;text-align:center;max-width:300px}
.top{padding:16px 18px 12px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.top h2{margin:0;font-size:19px;font-weight:650;letter-spacing:-.3px;word-break:break-all}
.top h2 small{display:block;color:var(--muted);font-size:12.5px;font-weight:400;letter-spacing:0;margin-top:2px}
nav{display:flex;gap:2px;padding:0 14px;border-bottom:1px solid var(--line)}
nav button{background:none;border:0;border-radius:0;color:var(--muted);padding:8px 8px 10px;border-bottom:2px solid transparent;margin-bottom:-1px}
nav button:hover{background:none;color:var(--text)}
nav button.on{color:var(--text);border-bottom-color:var(--accent)}
.pane{display:none;padding:16px 18px 24px}
.pane.on{display:block}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label{display:flex;flex-direction:column;gap:5px;color:var(--muted);font-size:12px}
label.wide{grid-column:1/-1}
label.check{flex-direction:row;align-items:center;gap:10px;color:var(--text);font-size:13.5px;grid-column:1/-1;cursor:pointer}
input,select,textarea{font:inherit;font-size:13.5px;color:var(--text);width:100%;height:34px;padding:0 10px;background:var(--bg);border:1px solid var(--line);border-radius:7px;transition:border-color .12s,box-shadow .12s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
input[type=number],input[data-f=id],input[data-f=what],input[data-gear],input[data-f=background],input[data-f=permission]{font-family:var(--mono);font-size:12.5px}
/* a switch, not a tick box */
input[type=checkbox]{appearance:none;width:32px;height:18px;padding:0;border-radius:99px;background:var(--line);border:0;position:relative;flex:none;cursor:pointer;transition:background .15s}
input[type=checkbox]::after{content:"";position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .15s}
input[type=checkbox]:checked{background:var(--accent)} input[type=checkbox]:checked::after{transform:translateX(14px)}
textarea{height:auto;min-height:92px;padding:8px 10px;resize:vertical;font-family:var(--mono);font-size:12.5px;line-height:1.5}
.row{display:grid;grid-template-columns:78px 1fr auto;gap:6px;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.row input{grid-column:1/-1}
.hint{color:var(--muted);font-size:12px;margin:12px 0 0;line-height:1.5}
/* the canvas keeps the look of the game: this is what the page is for */
.stage,.map{flex:1;min-height:340px;position:relative;overflow:hidden;border-radius:12px;user-select:none;touch-action:none;box-shadow:0 0 0 1px var(--line),0 12px 40px #0006}
.stage{background:linear-gradient(#8fb6ff 0,#b9d2ff 78%,#5f9440 78% 81%,#6f5238 81%)}
.stage.over{box-shadow:0 0 0 2px var(--accent),0 12px 40px #0006}
.stage .grid-lines{position:absolute;inset:0 0 22% 0;background:linear-gradient(#ffffff2e 1px,#0000 1px) 0 100%/100% 56px,linear-gradient(90deg,#ffffff2e 1px,#0000 1px) calc(50% + 28px) 0/56px 100%}
.origin{position:absolute;left:50%;bottom:22%;width:0;height:0}
.fig{position:absolute;bottom:0;transform:translateX(-50%);display:flex;flex-direction:column;filter:drop-shadow(0 3px 0 #0003)}
.fig i,.fig b,.fig u{display:block}
.playerfig i{background:#c99a72;flex:0 0 25%;margin:0 8%} .playerfig b{background:#2f9bb0;flex:0 0 37%} .playerfig u{background:#3b3fa0;flex:1;margin:0 12%}
.mobfig i{background:#b98a67;flex:0 0 28%;margin:0 4%} .mobfig b{background:#6a4a35;flex:1} .mobfig u{display:none}
.cubefig{background:linear-gradient(135deg,#a8a8a4,#7d7d79)}
.itemfig{background:linear-gradient(135deg,#9af0f4,#3fb6bd);transform:translateX(-50%) rotate(45deg)}
.fig-name{position:absolute;bottom:-30px;transform:translateX(-50%);white-space:nowrap;color:#fff;font:600 12px var(--mono);background:#0007;padding:2px 8px;border-radius:99px}
.chip{position:absolute;transform:translate(-50%,0);cursor:grab;white-space:pre;text-align:center;z-index:2;transition:box-shadow .12s}
.chip:active{cursor:grabbing}
.chip:hover{box-shadow:0 0 0 2px #fff9}
.chip.sel{box-shadow:0 0 0 2px var(--accent)}
.chip.k-text{background:#00000059;padding:3px 8px;font:14px/1.3 var(--mono);text-shadow:1px 1px 0 #0009}
.chip.k-item{width:24px;height:24px;background:linear-gradient(135deg,#9af0f4,#3fb6bd);transform:translate(-50%,0) rotate(45deg)}
.chip.k-block{width:32px;height:32px;background:linear-gradient(135deg,#a8a8a4,#7d7d79)}
.chip.k-particle{width:36px;height:36px;border-radius:50%;background:radial-gradient(#fff 0 12%,#0000 14%) 0 0/11px 11px,radial-gradient(#ffd23f 0 14%,#0000 16%) 5px 6px/13px 13px}
.tip{position:absolute;left:12px;bottom:12px;font-size:12px;color:#fff;background:#0b1a33aa;padding:5px 10px;border-radius:99px;backdrop-filter:blur(4px)}
.ruler{position:absolute;right:14px;bottom:calc(22% + 8px);width:56px;border-bottom:2px solid #fff;color:#fff;font-size:11px;text-align:center}
.map{background:#4d7d33 linear-gradient(#0000001a 1px,#0000 1px) 50% 50%/24px 24px,linear-gradient(90deg,#0000001a 1px,#0000 1px) 50% 50%/24px 24px;background-color:#4d7d33}
.pin{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:4px;cursor:grab;font:600 11px var(--mono);color:#fff;white-space:nowrap}
.pin span{background:#0007;padding:1px 7px;border-radius:99px}
.pin .cube{width:16px;height:16px;box-shadow:0 2px 0 #0004} .pin.sel .cube{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--accent)} .pin:not(.sel){opacity:.85}
.world{margin-top:12px;height:110px;position:relative;overflow:hidden;border-radius:9px;background:linear-gradient(#8fb6ff 0,#b9d2ff 70%,#5f9440 70% 76%,#6f5238 76%)}
.plate{position:absolute;left:50%;top:14%;transform:translateX(-50%);background:#00000059;padding:3px 8px;text-align:center;white-space:pre;font:14px/1.3 var(--mono);text-shadow:1px 1px 0 #0009}
@media(max-width:1000px){body{height:auto}main{grid-template-columns:1fr}aside,#editor{border:0;border-bottom:1px solid var(--line)}}
</style>
</head>

<script>
const token = new URLSearchParams(location.search).get('t') || '';
let state = {things: [], mobs: [], particles: [], slots: [], actions: []}, current = null, dirty = false, tab = 'what';
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const COLOURS = {0:'#000',1:'#0000aa',2:'#00aa00',3:'#00aaaa',4:'#aa0000',5:'#aa00aa',6:'#ffaa00',7:'#aaaaaa',8:'#555555',9:'#5555ff',a:'#55ff55',b:'#55ffff',c:'#ff5555',d:'#ff55ff',e:'#ffff55',f:'#ffffff'};
function status(text, kind) { const el = $('#status'); el.textContent = text; el.className = kind || ''; }
function touch() { dirty = true; $('#save').disabled = false; status('not saved yet'); }
// Minecraft & colour codes as HTML, for the preview
function mc(line) {
  let out = '', colour = '#fff', bold = false, italic = false, under = false, text = '';
  const flush = () => { if (text) out += `<span style="color:${colour};${bold ? 'font-weight:700;' : ''}${italic ? 'font-style:italic;' : ''}${under ? 'text-decoration:underline;' : ''}">${esc(text)}</span>`; text = ''; };
  for (let i = 0; i < line.length; i++) {
    const c = line[i], n = (line[i + 1] || '').toLowerCase();
    if (c === '&' && (COLOURS[n] || 'lnor'.includes(n) && n)) {
      flush(); i++;
      if (COLOURS[n]) { colour = COLOURS[n]; bold = italic = under = false; }
      else if (n === 'l') bold = true; else if (n === 'o') italic = true; else if (n === 'n') under = true;
      else { colour = '#fff'; bold = italic = under = false; }
    } else text += c;
  }
  flush(); return out || '&nbsp;';
}
const DEFAULTS = {id:'',group:'npc',kind:'mob',what:'villager',world:'world',x:0,y:64,z:0,yaw:0,pitch:0,lines:[],look:false,look_range:8,glow:false,scale:1,baby:false,sneaking:false,invisible:false,equipment:{},actions:[],cooldown:0.5,permission:'',billboard:'center',background:'',shadow:false,see_through:false,line_width:200,alignment:'center',spin:0,view_range:1,count:5,interval:10,spread:0.3,speed:0,attached:'',offset:[0,0,0]};
const KINDS = {npc:[['mob','Mob'],['player','Player'],['block','Block'],['item','Item']], display:[['text','Text'],['item','Item'],['block','Block'],['particle','Particles']]};
function list() {
  for (const group of ['npc', 'display']) {
    $('#' + group + 's').innerHTML = state.things.map((t, i) => t.group !== group ? '' :
      `<div class="item ${i === current ? 'on' : ''}" data-i="${i}" draggable="true"><i class="cube k-${esc(t.kind)}"></i><span class="name">${esc(t.id)} <small>${esc(t.what || t.kind)}</small></span>${t.attached ? `<span class="link" title="attached to ${esc(t.attached)}">on ${esc(t.attached)}</span>` : ''}</div>`).join('') || '<div class="note">none yet</div>';
  }
}
function num(name, label, t, step) { return `<label>${label}<input type="number" step="${step || 'any'}" data-f="${name}" value="${t[name]}"></label>`; }
function check(name, label, t) { return `<label class="check"><input type="checkbox" data-f="${name}" ${t[name] ? 'checked' : ''}>${label}</label>`; }
function select(name, label, t, options) { return `<label>${label}<select data-f="${name}">${options.map(o => { const [v, l] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(v)}" ${t[name] === v ? 'selected' : ''}>${esc(l)}</option>`; }).join('')}</select></label>`; }
function text(name, label, t, hint) { return `<label>${label}<input data-f="${name}" value="${esc(t[name])}" ${hint ? `placeholder="${esc(hint)}"` : ''}></label>`; }
const BLOCK = 56, TILE = 24;
const TALL = {enderman: 2.9, iron_golem: 2.7, warden: 2.9, chicken: 0.7, cat: 0.7, rabbit: 0.5, fox: 0.7, bat: 0.9, parrot: 0.9, bee: 0.6, pig: 0.9, sheep: 1.3, cow: 1.4, wolf: 0.85, slime: 1, horse: 1.6, spider: 0.9, creeper: 1.7, villager: 1.95};
// The NPC from the side, and the displays that ride on it. `npc` may be missing for a display
// that stands alone.
function stage(npc, selected) {
  if (!npc) return '';
  const k = npc.scale || 1, chips = state.things.map((d, i) => [d, i]).filter(([d]) => d.group === 'display' && d.attached === npc.id);
  let fig;
  if (npc.kind === 'block') fig = `<div class="fig cubefig" style="width:${BLOCK * k}px;height:${BLOCK * k}px;left:${BLOCK * k / 2}px"></div>`;
  else if (npc.kind === 'item') fig = `<div class="fig itemfig" style="width:${BLOCK * 0.45 * k}px;height:${BLOCK * 0.45 * k}px;bottom:${BLOCK * 0.25 * k}px"></div>`;
  else { const h = (npc.kind === 'player' ? 1.8 : TALL[npc.what] || 1.8) * k; fig = `<div class="fig ${npc.kind}fig" style="width:${BLOCK * 0.6 * k}px;height:${BLOCK * h}px"><i></i><b></b><u></u></div>`; }
  const drawn = chips.map(([d, i]) => `<div class="chip k-${esc(d.kind)} ${i === selected ? 'sel' : ''}" data-chip="${i}" title="${esc(d.id)}: drag to move" style="left:${d.offset[0] * BLOCK}px;bottom:${d.offset[1] * BLOCK}px">${d.kind === 'text' ? d.lines.map(mc).join('\n') : ''}</div>`).join('');
  return `<div class="stage" data-stage="${esc(npc.id)}"><div class="grid-lines"></div><div class="origin">${fig}<span class="fig-name">${esc(npc.id)}</span>${drawn}</div>
    <span class="tip">${chips.length ? 'Drag a display to move it' : 'Nothing is attached yet'} · drop one from the list to attach it</span><span class="ruler">1 block</span></div>`;
}
// Everything that stands on its own in the same world, from above, around `t`.
function map(t) {
  const pins = state.things.map((o, i) => [o, i]).filter(([o]) => !o.attached && o.world === t.world && Math.abs(o.x - t.x) < 40 && Math.abs(o.z - t.z) < 14);
  return `<div class="map" data-map><span class="tip">Seen from above · drag to move, snaps to half blocks</span>${pins.map(([o, i]) => `<div class="pin ${o === t ? 'sel' : ''}" data-pin="${i}" style="left:calc(50% + ${(o.x - t.x) * TILE}px);top:calc(50% + ${(o.z - t.z) * TILE}px)"><i class="cube k-${esc(o.kind)}"></i><span>${esc(o.id)}</span></div>`).join('')}</div>`;
}
function editor() {
  const el = $('#editor'), t = state.things[current];
  if (!t) { el.innerHTML = ''; $('#canvas').innerHTML = '<div class="empty">Pick an NPC or a display to see it here.</div>'; return; }
  const npc = t.group === 'npc', body = ['text', 'item', 'block'].includes(t.kind), alive = t.kind === 'mob' || t.kind === 'player';
  const what = t.kind === 'mob' ? select('what', 'Mob', t, state.mobs) : t.kind === 'particle' ? select('what', 'Particle', t, state.particles)
    : t.kind === 'player' ? text('what', 'Skin: a player name', t, 'Notch') : t.kind === 'text' ? '' : text('what', t.kind === 'block' ? 'Block' : 'Item', t, t.kind === 'block' ? 'stone' : 'diamond');
  const npcs = state.things.filter(o => o.group === 'npc').map(o => o.id);
  const panes = [];
  panes.push(['what', 'What', `<div class="grid">${text('id', 'Id', t, 'letters, numbers, - and _')}${select('kind', 'Kind', t, KINDS[t.group])}${what}${num('scale', 'Size (1 is normal)', t, 0.05)}</div>`]);
  if (t.kind === 'text') panes.push(['text', 'Text', `<label class="wide">One line per row. Colour codes: &amp;6 gold, &amp;e yellow, &amp;a green, &amp;c red, &amp;l bold<textarea data-lines spellcheck="false">${esc(t.lines.join('\n'))}</textarea></label>
    <div class="world"><div class="plate" id="preview"></div></div>
    <div class="grid" style="margin-top:14px">${select('alignment', 'Lines line up', t, ['center', 'left', 'right'])}${num('line_width', 'Width before wrapping', t, 1)}${text('background', 'Backing colour #AARRGGBB', t, 'as the game does it')}${check('shadow', 'Shadow under letters', t)}${check('see_through', 'Shows through walls', t)}</div>`]);
  let where = '';
  if (!npc) where += `<div class="grid" style="margin-bottom:12px">${select('attached', 'Rides on an NPC', t, [['', 'no, it stands alone'], ...npcs])}</div>`;
  if (!npc && t.attached) where += `<div class="grid"><label>Sideways<input type="number" step="any" data-o="0" value="${t.offset[0]}"></label><label>Up from its feet<input type="number" step="any" data-o="1" value="${t.offset[1]}"></label><label>Forwards<input type="number" step="any" data-o="2" value="${t.offset[2]}"></label></div><p class="hint">It goes wherever ${esc(t.attached)} goes.</p>`;
  else where += `<div class="grid">${text('world', 'World', t)}${num('x', 'X', t)}${num('y', 'Y', t)}${num('z', 'Z', t)}${num('yaw', 'Facing, degrees', t, 1)}${num('pitch', 'Tilt, degrees', t, 1)}</div>`;
  panes.push(['where', 'Where', where]);
  let looks = `<div class="grid">${check('glow', 'Glowing outline', t)}`;
  if (alive) looks += `${check('look', 'Watches the nearest player', t)}${check('invisible', 'Invisible', t)}${num('look_range', 'Watches within, blocks', t, 1)}`;
  if (body) looks += `${select('billboard', 'Turns to face you', t, [['center', 'always'], ['vertical', 'left and right only'], ['horizontal', 'up and down only'], ['fixed', 'never']])}${num('spin', 'Spins, degrees a second', t, 5)}${num('view_range', 'Seen from (1 is normal)', t, 0.1)}`;
  if (t.kind === 'particle') looks += `${num('count', 'Particles each puff', t, 1)}${num('interval', 'Ticks between puffs', t, 1)}${num('spread', 'How wide', t, 0.05)}${num('speed', 'How fast', t, 0.01)}`;
  panes.push(['looks', 'Looks', looks + '</div>']);
  if (alive) panes.push(['gear', 'Gear', `<div class="grid">${state.slots.map(s => `<label>${s}<input data-gear="${s}" value="${esc(t.equipment[s] || '')}" placeholder="nothing"></label>`).join('')}</div><p class="hint">Item names as the game spells them: diamond_sword, iron_helmet, shield.</p>`]);
  if (t.kind !== 'particle') panes.push(['clicks', 'Clicks' + (t.actions.length ? ' (' + t.actions.length + ')' : ''), `<div id="actions">${t.actions.map((a, i) => `<div class="row" data-a="${i}"><select data-ak="click">${['any', 'right', 'left'].map(c => `<option ${a.click === c ? 'selected' : ''}>${c}</option>`).join('')}</select><select data-ak="do">${state.actions.map(c => `<option ${a.do === c ? 'selected' : ''}>${c}</option>`).join('')}</select><input data-ak="value" value="${esc(a.value)}" placeholder="what to say, run, play, or x y z"><button class="small ghost danger" data-ar="${i}" title="Remove this">Remove</button></div>`).join('') || '<p class="hint" style="margin:0 0 10px">Nothing happens when this is clicked.</p>'}</div>
    <button data-act="action">+ add something</button><div class="grid" style="margin-top:16px">${num('cooldown', 'Seconds between clicks', t, 0.1)}${text('permission', 'Only players with permission', t, 'anyone')}</div>
    <p class="hint">%player% becomes whoever clicked, %id% becomes ${esc(t.id)}. Pumpkin only notices a left click on mobs, so use right or any for everything else.</p>`]);
  if (!panes.some(p => p[0] === tab)) tab = 'what';
  $('#canvas').innerHTML = stage(npc ? t : state.things.find(o => o.group === 'npc' && o.id === t.attached), current) || map(t);
  el.innerHTML = `<div class="top"><h2>${esc(t.id || '(no id)')} <small>${npc ? 'NPC' : 'Display'} · ${esc(t.kind)}</small></h2><div style="display:flex;gap:6px"><button class="ghost" data-act="copy">Duplicate</button><button class="ghost danger" data-act="delete">Delete</button></div></div>
    <nav>${panes.map(p => `<button data-tab="${p[0]}" class="${p[0] === tab ? 'on' : ''}">${p[1]}</button>`).join('')}</nav>
    ${panes.map(p => `<div class="pane ${p[0] === tab ? 'on' : ''}">${p[2]}</div>`).join('')}`;

}
// Draws the canvas again without touching the fields being typed in.
function redraw() { const t = state.things[current]; if (t) $('#canvas').innerHTML = stage(t.group === 'npc' ? t : state.things.find(o => o.group === 'npc' && o.id === t.attached), current) || map(t); }
function preview() { const p = $('#preview'), t = state.things[current]; if (p && t) p.innerHTML = t.lines.map(mc).join('\n'); }
document.addEventListener('input', e => {
  const t = state.things[current], el = e.target; if (!t) return;
  if (el.dataset.f) {
    const f = el.dataset.f; t[f] = el.type === 'checkbox' ? el.checked : el.type === 'number' ? (parseFloat(el.value) || 0) : el.value;
    touch();
    if (f === 'id') { $('.top h2').firstChild.textContent = (t.id || '(no id)') + ' '; list(); const n = $('.fig-name'); if (n && t.group === 'npc') n.textContent = t.id; }
    if (el.tagName === 'SELECT' && ['kind', 'attached'].includes(f)) {
      if (f === 'kind') { t.what = ({mob: 'villager', particle: 'flame', player: '', text: '', block: 'stone', item: 'diamond'})[t.kind]; if (t.kind === 'text' && !t.lines.length) t.lines = ['&eNew text']; }
      if (f === 'attached' && t.attached) t.offset = [0, 2.3, 0];
      list(); editor();
    } else if (f === 'what') { list(); redraw(); }
    else if (['scale', 'x', 'z'].includes(f)) redraw();
  } else if (el.dataset.lines !== undefined) { t.lines = el.value.split('\n'); touch(); preview(); redraw(); }
  else if (el.dataset.o) { t.offset[+el.dataset.o] = parseFloat(el.value) || 0; touch(); redraw(); }
  else if (el.dataset.gear) { if (el.value.trim()) t.equipment[el.dataset.gear] = el.value.trim(); else delete t.equipment[el.dataset.gear]; touch(); }
  else if (el.dataset.ak) { t.actions[+el.closest('.row').dataset.a][el.dataset.ak] = el.value; touch(); }
});
document.addEventListener('click', e => {
  const el = e.target, item = el.closest('.item[data-i]');
  if (item) { current = +item.dataset.i; list(); editor(); return; }
  if (el.dataset.tab) { tab = el.dataset.tab; editor(); return; }
  if (el.dataset.add) {
    const group = el.dataset.add; let n = 1; while (state.things.some(t => t.group === group && t.id === group + n)) n++;
    const near = state.things[current] || {};
    const t = Object.assign(structuredClone(DEFAULTS), {group, id: group + n, world: near.world || DEFAULTS.world, x: near.x || 0, y: near.y || 64, z: near.z || 0}, group === 'npc' ? {look: true} : {kind: 'text', what: '', lines: ['&eNew text']});
    state.things.push(t); current = state.things.length - 1; tab = 'what'; touch(); list(); editor(); return;
  }
  const t = state.things[current]; if (!t) return;
  if (el.dataset.act === 'delete') { if (confirm(`Delete ${t.id}?`)) { state.things.forEach(o => { if (t.group === 'npc' && o.attached === t.id) o.attached = ''; }); state.things.splice(current, 1); current = null; touch(); list(); editor(); } }
  else if (el.dataset.act === 'copy') { const c = structuredClone(t); let n = 2; while (state.things.some(o => o.group === c.group && o.id === t.id + n)) n++; c.id = t.id + n; c.x += 1; state.things.push(c); current = state.things.length - 1; touch(); list(); editor(); }
  else if (el.dataset.act === 'action') { t.actions.push({click: 'right', do: 'message', value: ''}); touch(); editor(); const rows = document.querySelectorAll('[data-ak=value]'); rows[rows.length - 1].focus(); }
  else if (el.dataset.ar) { t.actions.splice(+el.dataset.ar, 1); touch(); editor(); }
});
let drag = null;
document.addEventListener('pointerdown', e => {
  const chip = e.target.closest('.chip'), pin = e.target.closest('.pin');
  if (chip) { const t = state.things[+chip.dataset.chip]; drag = {el: chip, t, i: +chip.dataset.chip, x: e.clientX, y: e.clientY, from: [...t.offset], moved: false}; }
  else if (pin) { const t = state.things[+pin.dataset.pin]; drag = {el: pin, t, i: +pin.dataset.pin, x: e.clientX, y: e.clientY, from: [t.x, t.z], pin: true, moved: false}; }
  if (drag) { drag.el.setPointerCapture(e.pointerId); e.preventDefault(); }
});
document.addEventListener('pointermove', e => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!drag.moved && Math.hypot(dx, dy) < 4) return;
  drag.moved = true;
  const snap = (v, step) => Math.round(v / step) * step;
  if (drag.pin) {
    const here = state.things[current];
    drag.t.x = snap(drag.from[0] + dx / TILE, 0.5); drag.t.z = snap(drag.from[1] + dy / TILE, 0.5);
    drag.el.style.left = `calc(50% + ${(drag.t.x - (drag.t === here ? drag.from[0] : here.x)) * TILE}px)`;
    drag.el.style.top = `calc(50% + ${(drag.t.z - (drag.t === here ? drag.from[1] : here.z)) * TILE}px)`;
    if (drag.t === here) { const x = $('[data-f=x]'), z = $('[data-f=z]'); if (x) x.value = drag.t.x; if (z) z.value = drag.t.z; }
  } else {
    drag.t.offset[0] = +snap(drag.from[0] + dx / BLOCK, 0.05).toFixed(2); drag.t.offset[1] = +snap(drag.from[1] - dy / BLOCK, 0.05).toFixed(2);
    drag.el.style.left = drag.t.offset[0] * BLOCK + 'px'; drag.el.style.bottom = drag.t.offset[1] * BLOCK + 'px';
    if (drag.i === current) document.querySelectorAll('[data-o]').forEach(input => { input.value = drag.t.offset[+input.dataset.o]; });
  }
});
document.addEventListener('pointerup', () => {
  if (!drag) return;
  const d = drag; drag = null;
  if (d.moved) { touch(); if (d.pin) redraw(); }
  else if (d.i !== current) { current = d.i; tab = 'what'; list(); editor(); }
});
document.addEventListener('dragstart', e => { const item = e.target.closest('.item[data-i]'); if (item) e.dataTransfer.setData('text/plain', item.dataset.i); });
document.addEventListener('dragover', e => { const st = e.target.closest('.stage'); if (st) { e.preventDefault(); st.classList.add('over'); } });
document.addEventListener('dragleave', e => { const st = e.target.closest('.stage'); if (st) st.classList.remove('over'); });
document.addEventListener('drop', e => {
  const st = e.target.closest('.stage'); if (!st) return;
  e.preventDefault(); st.classList.remove('over');
  const d = state.things[+e.dataTransfer.getData('text/plain')];
  if (!d || d.group !== 'display') return status('only displays can be attached to an NPC', 'bad');
  const origin = $('.origin', st).getBoundingClientRect();
  d.attached = st.dataset.stage;
  d.offset = [+(Math.round((e.clientX - origin.left) / BLOCK / 0.05) * 0.05).toFixed(2), +Math.max(0, Math.round((origin.top - e.clientY) / BLOCK / 0.05) * 0.05).toFixed(2), 0];
  touch(); list(); editor();
});
async function load() {
  status('loading');
  try {
    const r = await fetch('/api/state?t=' + encodeURIComponent(token));
    if (r.status === 403) return status('this link is out of date: run /npc web in game for a new one', 'bad');
    state = await r.json(); state.things = state.things.map(t => Object.assign(structuredClone(DEFAULTS), t));
    current = null; dirty = false; $('#save').disabled = true; list(); editor();
    status(`cascade ${state.version}, ${state.things.length} on this server`, 'good');
  } catch (err) { status('could not reach the server (' + err.message + ')', 'bad'); }
}
$('#save').onclick = async () => {
  status('saving');
  try {
    const r = await fetch('/api/save?t=' + encodeURIComponent(token), {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({things: state.things})});
    if (r.status === 403) return status('this link is out of date: run /npc web in game for a new one', 'bad');
    const answer = await r.json();
    if (!answer.ok) return status(answer.error, 'bad');
    dirty = false; $('#save').disabled = true; status(`saved, ${answer.count} live in game`, 'good');
  } catch (err) { status('could not reach the server (' + err.message + ')', 'bad'); }
};
$('#reload').onclick = () => { if (!dirty || confirm('Throw away your unsaved changes?')) load(); };
window.addEventListener('beforeunload', e => { if (dirty) e.preventDefault(); });
load();
</script>
</body>
